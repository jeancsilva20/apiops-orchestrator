# =============================================================================
# EXEMPLO ANOTADO — `all.yaml` (escopo raiz da revision)
#
# Contrato fechado por: V-18 (nome, gramática e obrigatoriedade) · V-01 §5
# (o escopo `all` mapeia para a raiz da revision) · V-26 (herança declarada) ·
# D-005 §4 (árvore canônica) · V-25 (tombstone) · D-003 §4 (position/status fora
# do YAML).
#
# Evidência: materialização da API 417 (`Serviço de Letras 2.0.0`, /letras/v2),
# revision 9175, em `decisoes-refino-409/exemplos-gerados/saida/api-417-rev2/`.
# Os valores abaixo são reais, salvo onde anotado.
#
# -----------------------------------------------------------------------------
# O QUE NÃO APARECE NESTE ARQUIVO, E POR QUÊ
# -----------------------------------------------------------------------------
# `inherit`          SUPRIMIDO POR DECISÃO (V-18 §2.2). A raiz da revision é o
#                    topo da cadeia e não herda de nenhum escopo acima.
#                    Declará-lo é inerte: o comando emite INFO e prossegue.
#
# `position`         SUPRIMIDO POR DECISÃO (D-003 §4, V-12). A ORDEM DA LISTA é a
#                    fonte declarativa. No wire a `position` é obrigatória e
#                    contínua entre escopos, mas isso é cálculo do publish.
#
# `executionPoint`   SUPRIMIDO POR DECISÃO. Deriva da chave:
#                    `interceptors_request` → FIRST, `interceptors_response` → SECOND.
#
# `status`           SUPRIMIDO POR DECISÃO. Não há marcação de item removido: a
#                    supressão se expressa pela lista completa (V-25).
#
# `id` do interceptor  HIDRATADO NO PUBLISH. Item novo vai com `id: null`; item
#                    existente tem o seu preservado. Não se versiona.
#
# `idTemp`           CALCULADO NO PUBLISH. É único no PAYLOAD INTEIRO, não no
#                    escopo (W-9). Colisão faz o Manager descartar um item com
#                    HTTP 200 — perda silenciosa.
#
# interceptors fora  PRESERVADOS PELO MANAGER (V-22). A revision 9175 tem 1 item
# de FIRST/SECOND    em `THIRD`; ele não entra no YAML, não entra na conformidade
#                    e retorna intacto na publicação.
# =============================================================================


# Função: destino padrão da API, válido para toda a revision; os escopos abaixo
#         (recurso e operação) o substituem, nunca o acumulam — herança por
#         substituição, o mais específico vence (V-01).
# Obrigatório? Não. Mas quando declarado, `url` é obrigatória dentro dele.
# ReadOnly? Não.
# Regime de omissão: NA RAIZ, vazio se escreve OMITINDO A CHAVE (V-01 §6). Em
#         recurso e operação o vazio é `null`. `url: ''` significa HERDAR do
#         escopo acima (V-03) — na raiz não há acima, então equivale a sem destino.
# Origem: Usuário.
destination:
  # Função: URL do backend para onde o gateway encaminha.
  # Obrigatório? Sim, quando `destination` existe.
  # ReadOnly? Não.
  # Origem: Usuário. Aceita variável de ambiente (`$var`) para portabilidade
  #         entre ambientes — mecanismo nativo da plataforma (V-01).
  url: https://teste.com

  # Função: tempo máximo de espera do backend, EM SEGUNDOS.
  # Obrigatório? Não — opcional por decisão (V-01, D-m).
  # ReadOnly? Não.
  # Teto: 60 s, limite do gateway.
  # ATENÇÃO DE SERIALIZAÇÃO: o wire devolve este valor como STRING. Preservar as
  #         aspas é obrigatório; convertê-lo em inteiro quebra o round-trip.
  # Origem: Usuário.
  timeout: '30'


# Função: fluxo de interceptors da REQUISIÇÃO na raiz da revision. A ordem da
#         lista É a ordem de execução — não existe `position` aqui.
# Obrigatório? Não. Ausente ou vazia significa HERDAR (W-5) — e na raiz, que não
#         herda de ninguém, significa fluxo vazio de fato.
# ReadOnly? Não.
# Origem: Usuário; o `content` de itens existentes vem do Manager no import.
interceptors_request:

  # Função: interceptor Custom, referenciado pelo id numérico do catálogo.
  # Obrigatório? n/a (item de lista).
  # ReadOnly? O `id` é a referência; o script vive no tenant, não no repositório.
  # Regime: o id é ESTÁVEL DENTRO DE UM AMBIENTE. Ao mover o repositório entre
  #         ambientes a validação é do dev — e um id inexistente ABORTA a
  #         operação, nomeando o id (W-2), em vez de falhar na publicação.
  # Origem: Usuário.
  - type: Custom
    id: 32

  # Função: interceptor nativo. Em tipos nativos o `content` É a configuração, e
  #         é por ele que a conformidade com a régua compara (V-11 §4).
  # Obrigatório? n/a (item de lista).
  # Origem: Usuário.
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false

  - type: Custom
    id: 33

  - type: Rate limit
    content:
      # ATENÇÃO DE SERIALIZAÇÃO: o wire devolve `quota` como STRING ("1000").
      #         Preservar como string citada — o extrator gravava inteiro, e a
      #         comparação com a régua acusaria achado FALSO num campo idêntico.
      #         A normalização de escalar numérico no comparador é o outro lado
      #         desse mesmo reparo.
      quota: "1000"
      interval: SECOND
      limitBy: IP
      soft: false
      # Escalar vazio: string vazia, não `null`. A equivalência entre os dois NA
      #         ESCRITA ainda não foi confirmada (resto da P-8).
      softvalue: ""
      ignoreBodyValidationMultiPartFormData: false
      noHeaderBehavior: null
      headerKey: null
      rateLimitHeader: true

  - type: Payload size
    content:
      maxSize: 2048

  - type: XSS threat protection
    content:
      # ATENÇÃO DE SERIALIZAÇÃO: escalares iniciados por indicador YAML
      #         (`*` `&` `!` `|` `>` `%` `@` crase `[` `{` `,` `?`) precisam ser
      #         CITADOS. O caso real que quebrou o parse foi `replaceChar: *****`
      #         num interceptor de outra API.
      regexList:
        - URI_PATH: ((\%3C)|<)[^\n]+((\%3E)|>)
        - QUERY_PARAM: ((\%3C)|<)[^\n]+((\%3E)|>)
        - HEADER: ((\%3C)|<)[^\n]+((\%3E)|>)
        - BODY: ((\%3C)|<)[^\n]+((\%3E)|>)

  # Repetição legítima de tipo: a conformidade compara por SEQUÊNCIA, não por
  #         conjunto — um segundo `Log` desapareceria numa comparação por
  #         conjunto (V-11 §4, requisito 1).
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false


# Função: fluxo de interceptors da RESPOSTA na raiz da revision; mapeia para o
#         execution point SECOND.
# Obrigatório? Não. Mesmo regime de `interceptors_request`.
# ReadOnly? Não.
# Origem: Usuário.
interceptors_response:
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false


# Rodapé gerado pelo importador, informativo: registra quantos interceptors da
# revision ficaram fora de FIRST/SECOND e, portanto, fora deste arquivo.
# 1 interceptor(es) fora de FIRST/SECOND — estado não governado, preservado por GET no publish
