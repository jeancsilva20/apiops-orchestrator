name: Atribuicao Responsavel
description: Gerenciamento de tarefas de busca de letra de obras musicais
destination:
  url: "https://teste.com"
  timeout: "23"

inherit: true
# os interceptors abaixo executam depois do fluxo herdado

interceptors_request:
  - type: Custom
    id: 125
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false
  - type: Custom
    id: 178
  - type: Rate limit
    content:
      quota: "1000"
      interval: SECOND
      limitBy: IP
      soft: false
      softvalue: ""
      ignoreBodyValidationMultiPartFormData: false
      noHeaderBehavior: null
      headerKey: null
      rateLimitHeader: true
  - type: Payload size
    content:
      maxSize: "2048"
  - type: XSS threat protection
    content:
      regexList:
        - URI_PATH: ((\%3C)|<)[^\n]+((\%3E)|>)
        - QUERY_PARAM: ((\%3C)|<)[^\n]+((\%3E)|>)
        - HEADER: ((\%3C)|<)[^\n]+((\%3E)|>)
        - BODY: ((\%3C)|<)[^\n]+((\%3E)|>)
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false

interceptors_response:
  - type: Additional Info
    content:
      attributes:
        - expression: $header.key
          name: Teste
          type: STRING
          id: 1
      ignoreBodyValidationMultiPartFormData: false
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false
