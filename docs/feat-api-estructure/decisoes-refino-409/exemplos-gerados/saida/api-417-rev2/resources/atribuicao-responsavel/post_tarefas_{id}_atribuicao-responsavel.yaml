path: /tarefas/{id}/atribuicao-responsavel
destination:
  url: https://dev-backend.ecad.org.br/app-demo/servico-letras/v1/tarefas/{id}/atribuicao-responsavel
description: >-
  Atribui o usuário autenticado como responsável de uma tarefa pendente. O responsável é
  obtido automaticamente do token JWT (claim sub). A tarefa deve estar no status PENDENTE.
  Requer perfil EDITOR ou ADMIN.

inherit: true
# heranca preservada; o que vem abaixo SOMA ao fluxo herdado

interceptors_request:
  - type: Log
    content:
      encryptContent: true
      encryptPathAndParameters: true
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
