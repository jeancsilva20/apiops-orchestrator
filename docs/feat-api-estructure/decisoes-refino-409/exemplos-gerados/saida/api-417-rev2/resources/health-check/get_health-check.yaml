path: /health-check
destination:
  url: https://dev-backend.ecad.org.br/app-demo/servico-letras/v1/health-check
description: >-
  Retorna o status de saúde da aplicação. Endpoint público utilizado para readiness probes em
  ambientes Kubernetes e monitoramento do API Gateway.

inherit: false
# heranca quebrada: o fluxo abaixo substitui o herdado (ausentes: Custom#178, Custom#32)

interceptors_request:
  - type: Custom
    id: 32
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false
  - type: Rate limit
    content:
      quota: 1000
      interval: SECOND
      limitBy: IP
      soft: false
      softvalue: ""
      ignoreBodyValidationMultiPartFormData: false
      noHeaderBehavior: null
      headerKey: null
      rateLimitHeader: true
  - type: Payload size
    content:
      maxSize: 2048
  - type: XSS threat protection
    content:
      regexList:
        - URI_PATH: ((\%3C)|<)[^\n]+((\%3E)|>)
        - QUERY_PARAM: ((\%3C)|<)[^\n]+((\%3E)|>)
        - HEADER: ((\%3C)|<)[^\n]+((\%3E)|>)
        - BODY: ((\%3C)|<)[^\n]+((\%3E)|>)
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false

interceptors_response:
  - type: Log
    content:
      acceptedTerms: true
      encryptContent: false
      encryptPathAndParameters: false
