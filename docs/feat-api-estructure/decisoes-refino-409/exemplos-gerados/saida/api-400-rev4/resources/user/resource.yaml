name: User
destination:
  url: ''            # vazio = herda do escopo acima

inherit: false
# este ponto deixa de executar, do herdado: Log, OAuth
# a lista abaixo é o fluxo completo que vale aqui

interceptors_request:
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
  - type: Client ID validation
    content:
      location: HEADER
      name: client_id
      responseContentType: APPLICATION_JSON
      ignoreBodyValidationMultiPartFormData: false
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false

interceptors_response:
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
