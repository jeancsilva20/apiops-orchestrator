name: User
destination:
  url: ''            # vazio = herda do escopo acima

# inherit: true  executa o fluxo herdado do escopo acima e, depois, os interceptors declarados abaixo
# inherit: false ignora o fluxo herdado e executa só os interceptors declarados abaixo
inherit: false

interceptors_request:
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
  - type: Client ID validation
    content:
      location: HEADER
      name: client_id
      responseContentType: APPLICATION_JSON
      ignoreBodyValidationMultiPartFormData: false
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false

interceptors_response:
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
