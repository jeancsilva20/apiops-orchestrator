[tool.poetry]
name = "apiops-orchestrator"
# Fonte unica de versao: lida em runtime via importlib.metadata (cli_adapter.cli_version).
# IMPORTANTE: ao gerar um .exe (bundle frozen), a metadata (*.dist-info) NAO entra no
# bundle por padrao — configurar o empacotador para copiala (PyInstaller:
# --copy-metadata apiops-orchestrator) ou selar a versao em arquivo ao lado do binario,
# caso contrario `sen --version` cai no fallback estatico do cli_version().
version = "0.1.1"
description = "Ferramenta de linha de comando para automação e boas práticas em ApiOps."
authors = ["Your Name <you@example.com>"]
license = "n"
readme = "README.md"
packages = [{ include = "apiops_orchestrator", from = "src" }]

[tool.poetry.scripts]
sen = "apiops_orchestrator.main:main"

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.19.2"
rich = "^14.1.0"
pydantic = "^2.11.9"
python-dotenv = "^1.1.1"
pydantic-settings = "2.11.0"
pyyaml = "^6.0.1"
jsonschema = "^4.23.0"
requests = "^2.32.3"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
black = "^25.9.0"
ruff = "^0.13.2"
flynt = "^1.0.6"
mypy = "^1.18.2"
deptry = "^0.23.1"
bandit = "^1.8.6"
safety = "^3.6.2"

# Cobertura fica aqui, nao em `addopts` do pytest.ini: instrumentar todo
# `pytest -k` de loop curto e imposto desnecessario. O gate e um comando
# explicito, documentado no README e rodado no CI:
#   pytest tests/unit/adapters/inbound/cli #     --cov=apiops_orchestrator.adapters.inbound.cli --cov-fail-under=93
# 93 e o piso MEDIDO com `branch = true` (96% por statement, 93% por ramo), nao
# uma meta: gate declarado acima do medido nasce quebrado e e logo desligado.
# Sobe quando a medicao subir.
[tool.coverage.run]
source = ["apiops_orchestrator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# Uma fonte so para as duas ferramentas: sem isto, `ruff` e `black` podem
# divergir na largura de linha e brigar a cada commit.
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.black]
target-version = ["py312"]
line-length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
