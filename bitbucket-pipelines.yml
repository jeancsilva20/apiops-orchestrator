# bitbucket-pipelines.yml
image: python:3.12

definitions:
  caches:
    pip: ~/.cache/pip
    poetry: ~/.cache/pypoetry

pipelines:
  branches:
    main:
      - step:
          name: Build + Run + Tests
          caches:
            - pip
            - poetry
          script:
            # Versão do Python
            - python -V

            # Instala Poetry e deps
            - python -m pip install --upgrade pip
            - pip install poetry
            - poetry --version
            - poetry install

            # Clona o repositório externo (Azure DevOps) com credenciais
            - echo "Clonando repositório com credenciais do Git..."
            - git clone "https://${GIT_USERNAME}:${GIT_PAT}@dev.azure.com/jeancsilva2025S/ROBOT/_git/Sensedia%20Pipeline%20MAG" ./external-repo
            - echo "Listando conteúdo clonado:"
            - ls -la ./external-repo
            - ls -la ./

            # Executa o main
            - poetry run python src/apiops_orchestrator/main.py

            # Testes com pytest + JUnit XML
            - mkdir -p test-results
            - poetry run pytest --junitxml=test-results/pytest-results.xml
          artifacts:
            - test-results/**
