image: python:3.12

definitions:
  caches:
    pip: ~/.cache/pip
    poetry: ~/.cache/pypoetry

pipelines:
  branches:
    release:
      - step:
          name: Build + Run + Tests
          caches:
            - pip
            - poetry
          script:
            # Atualiza pip e instala Poetry
            - python -m pip install --upgrade pip
            - pip install poetry

            # Instala plugin para relatório HTML do pytest
            - pip install pytest-html

            # Instala dependências do projeto via Poetry
            - poetry install

            # Clona o repositório externo via Repository Access Token
            - echo "Clonando repositório sensedia/apis-repo via Repository Access Token..."
            - git clone --depth 1 "https://${BB_USERNAME}:${BB_REPO_TOKEN}@bitbucket.org/sensedia/apis-repo.git" ./external-repo
            - ls -la ./external-repo

            # Cria arquivo .env
            - printf "PROD_URL=%s\nAUTHORIZATION=%s\nREQUEST_TIMEOUT=%s\nAPI_ID=%s\n" \
              "$PROD_URL" "$AUTHORIZATION" "$REQUEST_TIMEOUT" "$API_ID" > .env

            # Executa aplicação
            - poetry run python src/apiops_orchestrator/main.py

            # Executa testes + relatórios (JUnit + HTML)
            - mkdir -p artefacts
            - poetry run pytest \
                --junitxml=artefacts/pytest-results.xml \
                --html=artefacts/pytest-report.html \
                --self-contained-html
          artifacts:
            - artefacts/**
