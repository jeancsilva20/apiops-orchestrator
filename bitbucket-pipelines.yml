# bitbucket-pipelines.yml
image: python:3.12

definitions:
  caches:
    pip: ~/.cache/pip
    poetry: ~/.cache/pypoetry

pipelines:
  branches:
    main:
      - step:
          name: Build + Run + Tests
          caches:
            - pip
            - poetry
          script:
            # Python e Poetry
            - python -m pip install --upgrade pip
            - pip install poetry
            - poetry --version
            - poetry install

            # Clona repositório externo (Azure DevOps) com credenciais já cadastradas
            - echo "Clonando repositório com credenciais..."
            - : "${GIT_USERNAME:?Defina GIT_USERNAME em Repository variables}"
            - : "${GIT_PAT:?Defina GIT_PAT em Repository variables}"
            - git clone "https://${GIT_USERNAME}:${GIT_PAT}@dev.azure.com/jeancsilva2025S/ROBOT/_git/Sensedia%20Pipeline%20MAG" ./external-repo
            - ls -la ./external-repo

            # --- Variáveis exigidas pelo Settings (vêm da esteira) ---
            - : "${PROD_URL:?Faltando PROD_URL}"
            - : "${AUTHORIZATION:?Faltando AUTHORIZATION}"
            - : "${REQUEST_TIMEOUT:?Faltando REQUEST_TIMEOUT}"
            - : "${API_ID:?Faltando API_ID}"

            # Se o projeto usa pydantic BaseSettings com env_file, garanta o .env
            - printf "PROD_URL=%s\nAUTHORIZATION=%s\nREQUEST_TIMEOUT=%s\nAPI_ID=%s\n" \
              "$PROD_URL" "$AUTHORIZATION" "$REQUEST_TIMEOUT" "$API_ID" > .env

            # Executa aplicação
            - poetry run python src/apiops_orchestrator/main.py

            # Testes + JUnit
            - mkdir -p test-results
            - poetry run pytest --junitxml=test-results/pytest-results.xml
          artifacts:
            - test-results/**
