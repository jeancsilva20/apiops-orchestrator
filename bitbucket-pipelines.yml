# bitbucket-pipelines.yml
image: python:3.12

definitions:
  caches:
    pip: ~/.cache/pip
    poetry: ~/.cache/pypoetry

pipelines:
  branches:
    main:
      - step:
          name: Build + Run + Tests
          caches:
            - pip
            - poetry
          script:
            # Atualiza e instala dependências Python
            - python -m pip install --upgrade pip
            - pip install poetry
            - poetry --version
            - poetry install

            # Clona repositório externo (Bitbucket) via API Token pessoal
            - echo "Clonando repositório sensedia/apis-repo via token pessoal..."
            - git clone --depth 1 "https://jeansilva6:${BB_API_TOKEN}@bitbucket.org/sensedia/apis-repo.git" ./external-repo
            - ls -la ./external-repo

            # Cria arquivo .env usado pela aplicação
            - printf "PROD_URL=%s\nAUTHORIZATION=%s\nREQUEST_TIMEOUT=%s\nAPI_ID=%s\n" \
              "$PROD_URL" "$AUTHORIZATION" "$REQUEST_TIMEOUT" "$API_ID" > .env

            # Executa aplicação
            - poetry run python src/apiops_orchestrator/main.py

            # Executa testes e gera relatório JUnit
            - mkdir -p test-results
            - poetry run pytest --junitxml=test-results/pytest-results.xml

          artifacts:
            - test-results/**
