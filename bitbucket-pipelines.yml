image: python:3.12

definitions:
  caches:
    pip: ~/.cache/pip
    poetry: ~/.cache/pypoetry

pipelines:
  branches:
    main:
      - step:
          name: Build, run e testes
          caches:
            - pip
            - poetry
          script:
            - python -V
            - pip install --upgrade pip
            - pip install poetry
            - poetry --version

            # --- Pré-checagem de variáveis obrigatórias ---
            - : "${PROD_URL:?Defina a variável PROD_URL em Repository variables}"
            - : "${AUTHORIZATION:?Defina a variável AUTHORIZATION em Repository variables}"
            - : "${REQUEST_TIMEOUT:?Defina a variável REQUEST_TIMEOUT (ex.: 30) em Repository variables}"
            - : "${API_ID:?Defina a variável API_ID em Repository variables}"
            # Credenciais usadas no clone do outro repositório
            - : "${GIT_USERNAME:?Defina GIT_USERNAME em Repository variables}"
            - : "${GIT_PAT:?Defina GIT_PAT em Repository variables}"

            # --- Clone do repositório externo (Azure DevOps) ---
            - echo "Clonando repositório com credenciais do Git..."
            - git clone "https://${GIT_USERNAME}:${GIT_PAT}@dev.azure.com/jeancsilva2025S/ROBOT/_git/Sensedia%20Pipeline%20MAG" ./external-repo
            - ls -la ./external-repo

            # --- Dependências do projeto ---
            - poetry install

            # --- Execução principal ---
            - poetry run python src/apiops_orchestrator/main.py

            # --- Testes ---
            - mkdir -p test-results
            - poetry run pytest --junitxml=test-results/pytest-results.xml
          artifacts:
            - test-results/**
