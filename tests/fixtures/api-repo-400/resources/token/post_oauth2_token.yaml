path: /oauth2/token
destination:
  url: "https://api-consulting.sensedia.com/oauth/v1/access-token"
description: Emite um token de acesso no fluxo client credentials, a partir do client_id e do client_secret do cliente.

inherit: true
# os interceptors abaixo executam depois do fluxo herdado

interceptors_request:
  - type: Log obfuscation
    content:
      location: HEADER
      regexToReplace: \w.*
      attr: client_secret
      replaceChar: "*****"
      ignoreBodyValidationMultiPartFormData: false
  - type: Log obfuscation
    content:
      location: HEADER
      regexToReplace: \w.*
      replaceChar: "*****"
      attr: client_id
      ignoreBodyValidationMultiPartFormData: false
  - type: Log obfuscation
    content:
      location: HEADER
      regexToReplace: \w.*
      attr: authorization
      replaceChar: "*****"
      ignoreBodyValidationMultiPartFormData: false
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
  - type: Custom
    id: 28
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
  - type: Client ID validation
    content:
      location: ANY
      name: client_id
      responseContentType: APPLICATION_JSON
      ignoreBodyValidationMultiPartFormData: false
  - type: Custom
    id: 29
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
  - type: Custom
    id: 26
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
  - type: Custom
    id: 27
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false

interceptors_response:
  - type: Log obfuscation
    content:
      location: BODY
      regexToReplace: "(?<=(\"access_token\"|\"admin_access_token\"|\"user_name\"|\"user_email\")\\s?:\\s?\"[0-9A-Za-z]{3})[a-zA-Z0-9!@#$%^&*()_+\\-=\\[\\];':\"\\|.<>\\/?\\sÀ-ü]*"
      attr: null
      replaceChar: "*****"
      ignoreBodyValidationMultiPartFormData: false
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false
  - type: Custom
    id: 30
  - type: Log
    content:
      acceptedTerms: true
      ignoreBodyValidationMultiPartFormData: false

summary: Emite um token de acesso
operationId: emitirToken
tags:
  - Token
security:
  - BasicCliente: []
requestBody:
  $ref: '#/components/requestBodies/SolicitacaoToken'
responses:
  '200':
    description: Token emitido
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Token'
  '401':
    $ref: '#/components/responses/NaoAutorizado'
